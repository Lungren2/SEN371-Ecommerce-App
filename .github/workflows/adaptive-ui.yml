name: Adaptive UI checks

on:
  pull_request:
    paths:
      - 'GrandmastersHub/GrandmastersHub.Api/client/**'
      - '.github/workflows/adaptive-ui.yml'
  push:
    branches: [main]
    paths:
      - 'GrandmastersHub/GrandmastersHub.Api/client/**'
      - '.github/workflows/adaptive-ui.yml'

permissions:
  contents: read

jobs:
  adaptive-ui:
    name: Adaptive UI / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: GrandmastersHub/GrandmastersHub.Api/client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            GrandmastersHub/GrandmastersHub.Api/client/package-lock.json
            GrandmastersHub/GrandmastersHub.Api/client/tests/browser/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Install browser test dependencies
        run: npm ci --ignore-scripts
        working-directory: GrandmastersHub/GrandmastersHub.Api/client/tests/browser

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: GrandmastersHub/GrandmastersHub.Api/client/tests/browser

      - name: Run adaptive layout tests
        run: npm run test:adaptive
        working-directory: GrandmastersHub/GrandmastersHub.Api/client/tests/browser
        env:
          CI: 'true'

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-ui-failures
          path: GrandmastersHub/GrandmastersHub.Api/client/tests/browser/test-results
          if-no-files-found: ignore
          retention-days: 7
