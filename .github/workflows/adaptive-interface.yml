name: Adaptive interface checks

on:
  pull_request:
    paths:
      - 'GrandmastersHub/GrandmastersHub.Api/client/src/**'
      - 'GrandmastersHub/GrandmastersHub.Api/client/tests/browser/**'
      - 'GrandmastersHub/GrandmastersHub.Api/client/package.json'
      - 'GrandmastersHub/GrandmastersHub.Api/client/package-lock.json'
      - '.github/workflows/adaptive-interface.yml'
  push:
    branches: [main]
    paths:
      - 'GrandmastersHub/GrandmastersHub.Api/client/src/**'
      - 'GrandmastersHub/GrandmastersHub.Api/client/tests/browser/**'
      - 'GrandmastersHub/GrandmastersHub.Api/client/package.json'
      - 'GrandmastersHub/GrandmastersHub.Api/client/package-lock.json'
      - '.github/workflows/adaptive-interface.yml'

permissions:
  contents: read

jobs:
  adaptive-browser:
    name: Viewport composition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: GrandmastersHub/GrandmastersHub.Api/client/tests/browser

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            GrandmastersHub/GrandmastersHub.Api/client/package-lock.json
            GrandmastersHub/GrandmastersHub.Api/client/tests/browser/package-lock.json

      - name: Install application dependencies
        run: npm ci
        working-directory: GrandmastersHub/GrandmastersHub.Api/client

      - name: Build application
        run: npm run build
        working-directory: GrandmastersHub/GrandmastersHub.Api/client

      - name: Install browser test dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify adaptive interfaces
        run: npx playwright test adaptive-layout.spec.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: adaptive-interface-failures
          path: GrandmastersHub/GrandmastersHub.Api/client/tests/browser/test-results
          if-no-files-found: ignore
          retention-days: 5
