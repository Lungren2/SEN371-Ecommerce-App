databases:
  - name: grandmasters-hub-db
    databaseName: grandmastershub
    plan: free
    region: frankfurt

services:
  - type: web
    name: grandmasters-hub
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    repo: https://github.com/Lungren2/SEN371-Ecommerce-App
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: grandmasters-hub-db
          property: connectionString
      - key: Database__Provider
        value: Postgres
      - key: Database__EnsureCreatedOnStartup
        value: "true"
      - key: Database__ApplyMigrationsOnStartup
        value: "false"
      - key: Jwt__Issuer
        value: GrandmastersHub.Api
      - key: Jwt__Audience
        value: GrandmastersHub.Client
      - key: Jwt__SigningKey
        generateValue: true
      - key: Jwt__ExpiryMinutes
        value: "60"
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
